<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скачать Excel-файл</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#14181d;--line:#2a3139;--text:#f4f6f8;--muted:#a8b0ba;--accent:#d6a85f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#20252b 0,#0b0d10 58%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
main{width:min(100%,520px);padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(20,24,29,.94);box-shadow:0 24px 80px #0008;text-align:center}
.mark{width:66px;height:66px;display:grid;place-items:center;margin:0 auto 22px;border-radius:18px;background:#252a30;color:var(--accent);font-size:30px}
h1{margin:0 0 10px;font-size:clamp(24px,5vw,32px);letter-spacing:-.5px}p{margin:0;color:var(--muted);line-height:1.6}
a{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;padding:16px 20px;border-radius:13px;background:var(--accent);color:#17130c;text-decoration:none;font-weight:750;transition:transform .15s,filter .15s}
a:hover{filter:brightness(1.08);transform:translateY(-1px)}small{display:block;margin-top:18px;color:#7f8994;font-size:12px}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">↓</div>
<h1>Excel-файл готов к загрузке</h1>
<p>Нажмите кнопку ниже — файл сразу начнёт скачиваться на ваш ноутбук.</p>
<a href="./table.xlsx" download="Практическая_работа_3.xlsx"><span aria-hidden="true">⬇</span> Скачать Excel-файл (.xlsx)</a>
<small>Формат Microsoft Excel · XLSX</small>
</main>
</body>
</html>
